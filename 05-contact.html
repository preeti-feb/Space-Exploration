<body>
    <header>
        <h1>Space<span>Explore</span></h1>
        <nav>
            <ul>

        <div class="icons">
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(255, 255, 255);"></i>
            <i class="fa-solid fa-bars" style="color: rgb(255, 255, 255);"></i>
        </div>
    
    </header>


    <main>
        <section class="contact">
            <div class="contact1">
                <h3>Contact Me</h3>
                <h1>Get in Touch</h1>
                <p>Have questions, suggestions, want to collaborate?</p><br>
                <div class="box">
                    <p>Gmail: <a href="#">preeti.connection@gmail.com</a>
                    <p>Location: <b>Black Hole and White Hole</b></p>
                </div>
            </div>

            <div class="form-box">

                <div class="form">
                     <form action="">
                    <label for="name">Full Name:</label>

                    <input type="text" id="name" name="name" placeholder="Enter your full name" required />

                    <label for="email">Email:</label>

                    <input type="email" id="email" name="email" placeholder="Enter your valid email" required />

                    <label for="profession">Profession:</label>

                    <select name="profession" id="profession" required>
                        <option value="" selected disabled>Your Profession</option>
                        <option value="student">Student</option>
                        <option value="entrepreneur">Entrepreneur</option>
                        <option value="developer">Developer</option>
                        <option value="other">Other</option>
                    </select>

                    <label for="other"> If Other, please specify: </label>

                    <input type="text" id="other" name="other" placeholder="Enter your profession" />

                    <label for="message"> Your Reason: </label>

                    <textarea name="text" id="message" rows="3" cols="20"
                        placeholder="Write your reason here......."></textarea>

            </form>
                </div>
            </div>
        </section>
    </main>

    <footer>

    </footer>
